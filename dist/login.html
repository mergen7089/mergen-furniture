<!doctype html>
<html data-page="login" lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ورود | مرگن</title>
    <link href="./css/style.css" rel="stylesheet">
<link href="./fonts/vazirmatn/vazirmatn.css" rel="stylesheet">
<script src="./js/main.js"></script>
</head>

<body>
    <main class="scene">
        <div class="grain"></div>
        <div class="mark">MERGEN / 2026</div>
        <div class="side-copy">
            <div class="eyebrow">Mergen Furniture</div>
            <h2>فضایی برای<br><span style="color:#9fc5aa">انتخاب‌های ماندگار.</span></h2>
            <p>به فضای شخصی مرگن وارد شوید؛ جایی که طراحی، متریال و جزئیات کنار هم معنا پیدا می‌کنند.</p>
            <div class="line"></div>
        </div>
        <div class="wrap">
            <section class="card" aria-label="ورود به حساب کاربری">
                <div class="inner">
                    <div class="brand"><a href="index.html" aria-label="MERGEN"><img src="img/logo.jpg" alt="MERGEN"></a></div>
                    <div class="eyebrow">PRIVATE SPACE</div>
                    <h1 class="title">خوش برگشتی</h1>
                    <p class="sub">برای ادامه، وارد حساب کاربری مرگن شوید.</p>
                    <form data-prevent>
                        <div class="field"><label class="label">ایمیل یا شماره موبایل</label><input class="input"
                                type="text" placeholder="ایمیل یا شماره موبایل شما" autocomplete="username"></div>
                        <div class="field"><label class="label">رمز عبور</label>
                            <div class="input-wrap"><input id="pass" class="input" type="password"
                                    placeholder="رمز عبور" autocomplete="current-password"><button type="button"
                                    class="reveal" onclick="togglePass()" aria-label="نمایش رمز">◉</button></div>
                        </div>
                        <div class="row"><label class="remember"><input type="checkbox"> مرا به خاطر بسپار</label><a
                                class="link" href="#">رمز عبور را فراموش کرده‌اید؟</a></div>
                        <button type="submit"
                            class="group relative w-full overflow-hidden rounded-xl border border-[#17251F]/40 px-6 py-4 text-sm font-medium text-white transition-all duration-500">
                            <span
                                class="absolute inset-y-0 right-0 w-0 bg-[#79D6AA] transition-all duration-500 ease-out group-hover:w-full"></span>
                            <span
                                class="absolute -right-10 top-1/2 h-20 w-20 -translate-y-1/2 rounded-full bg-[#79D6AA]/40 blur-2xl opacity-0 transition-all duration-500 group-hover:right-1/2 group-hover:opacity-100"></span>
                            <!-- Text -->
                            <span class="relative z-10 text-white transition-colors duration-500 group-hover:text-[#07100D]">
    ورود به حساب
</span>
                        </button>
                        <div class="divider">یا</div>
                        <div class="signup">هنوز حسابی ندارید؟ <a href="register.html">ساخت حساب جدید</a></div>
                    </form>
                </div>
            </section>
        </div>
    </main>
    </body>

</html>
